# IGOS Nusantara 26 with the Bayu desktop. Read by build-image.sh and
# build-iso.sh; repositories come from repos.d/ next to this file.
DISTRO_NAME="IGOS Nusantara 26"
SHORT_NAME="IGN 26"
RELEASEVER=10
IMAGE_NAME=igos-bayu
IMAGE_SIZE=16G
ISO_LABEL=IGOS-26-BAYU
HOSTNAME=igos
TIMEZONE=Asia/Jakarta
LOCALE=id_ID.UTF-8
KEYMAP=us
USER_NAME=igos
USER_PASSWORD=igos        # change me; the live ISO logs in without it
ROOT_PASSWORD=            # empty: root locked
AUTOLOGIN=yes
SUDO_NOPASSWD=yes
SELINUX=permissive
# lapis (Android apps) is installed but stays off until enabled:
#   sudo systemctl enable --now lapis-control.socket && sudo lapis init
LAPIS_ENABLED=no
# Where the installed system gets Bayu updates: the repository that
# builder/publish-repo.sh fills on each release. Empty: out/repo, at build
# time only.
BAYU_REPO_URL=https://r2.igos-nusantara.or.id/26/bayu/
# Dual boot: os-prober puts Windows in GRUB's menu (nabau's post-install),
# ntfs-3g and exfatprogs read and repair its drives.
# The command-line tools users expect after installing (issue #87): git,
# editors, wget, process and disk viewers, network tools, man pages.
# IGOS Nusantara's release (os-release ID=ign, which Anaconda's ign profile
# matches), EL 10.2 to packages (#100), in place of AlmaLinux's, which
# `dnf upgrade` replaced with it anyway; and its terminal defaults (#99).
# Wi-Fi: broadcom-wl + kmod-wl for the older Broadcom chips of MacBooks up to
# 2015 (see rootfs/etc/modprobe.d/wl.conf), firmware for brcmfmac (newer
# Broadcom, as in MacBooks from 2015 on), Intel, Realtek (rtw88, rtw89:
# RTL8852BE...), Qualcomm Atheros and MediaTek cards.
# Security keys (FIDO U2F/FIDO2, as YubiKey) for logging in and sudo:
# pam_u2f, and pamu2fcfg to register a key (~/.config/Yubico/u2f_keys).
PACKAGES="@core kernel grub2-pc grub2-efi-x64 shim-x64 grub2-tools xfsprogs dracut-config-generic
  glibc-langpack-en glibc-langpack-id glibc-langpack-ms glibc-langpack-su glibc-langpack-zh glibc-langpack-ja
  glibc-langpack-ko glibc-langpack-es glibc-langpack-fr glibc-langpack-de glibc-langpack-pt glibc-langpack-ru
  google-noto-sans-cjk-vf-fonts ign-release linux-firmware mesa-dri-drivers
  broadcom-wl kmod-wl brcmfmac-firmware iwlwifi-mvm-firmware iwlwifi-dvm-firmware
  realtek-firmware atheros-firmware mt7xxx-firmware
  qemu-guest-agent efibootmgr chrony NetworkManager-wifi bayu-desktop lapis
  os-prober ntfs-3g exfatprogs
  git vim-enhanced nano wget tree htop btop fastfetch tmux bind-utils traceroute mtr whois iotop-c ncdu
  7zip bc python3-pip strace man-pages ign-config pam-u2f pamu2fcfg"
# Live media only, for the installer: resizing Windows (NTFS) partitions.
ISO_PACKAGES="ntfsprogs"
